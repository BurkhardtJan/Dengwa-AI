server {
    listen 80;
    server_name localhost;

    location /api/ {
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Das magische SPA-Routing:
        try_files $uri $uri/ /index.html;

        # Cross-origin isolation: required for SharedArrayBuffer, which
        # onnxruntime-web (used by the WASM TTS engine) needs to run
        # multi-threaded. Without this it silently falls back to a
        # single-threaded WASM path, which is significantly slower.
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}